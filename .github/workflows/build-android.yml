name: Build OnionGuard Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then npx cap add android; else npx cap sync android; fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK (installable on any phone)
        run: cd android && ./gradlew assembleDebug

      - name: Build release AAB (for Play Store upload)
        run: cd android && ./gradlew bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OnionGuard-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: OnionGuard-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
